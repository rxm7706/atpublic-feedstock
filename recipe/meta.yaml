{% set name = "atpublic" %}
{% set version = "8.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4cc00a2b8ea5645a268edc310667302fe1de2b91aba88d0bd634c0e6564f6ef4


build:
  number: 0
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv '
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}

test:
  imports:
    - public
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://public.readthedocs.io/
  dev_url: https://gitlab.com/warsaw/public.git
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Keep all y'all's __all__'s in sync
  doc_url: https://public.readthedocs.io

extra:
  recipe-maintainers:
    - keller00
    - johanneskoester
